<?xml version="1.0" encoding="UTF-8"?>

<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<f:metadata>

    <f:viewParam
        name="podID"
        value="#{podBean.selectedPodID}" />

</f:metadata>


<h:head>

    <h:outputStylesheet
        library="css"
        name="edit.css" />

    <title>Edit Pod</title>

</h:head>


<h:body>

    <div class="edit-page-container">

        <h1>Edit Pod</h1>


        <h:form id="editPodForm">


            <!-- POD ID - READ ONLY -->

            <div class="edit-field">

                <h:outputLabel value="Pod ID" />

                <div class="edit-readonly">

                    <h:outputText
                        value="#{podBean.selectedPod.podID}" />

                </div>

            </div>


            <!-- ROOM - READ ONLY -->

            <div class="edit-field">

                <h:outputLabel value="Room" />

                <div class="edit-readonly">

                    <h:outputText
                        value="#{podBean.selectedPodRoom.name}" />

                </div>

            </div>


            <!-- SPECIES - READ ONLY -->

            <div class="edit-field">

                <h:outputLabel value="Species" />

                <div class="edit-readonly">

                    <h:outputText
                        value="#{podBean.selectedPodSpecies.label}" />

                </div>

            </div>


            <!-- STATUS - READ ONLY -->

            <div class="edit-field">

                <h:outputLabel value="Status" />

                <div class="edit-readonly">

                    <h:outputText
                        value="#{podBean.selectedPodStatus}" />

                </div>

            </div>


            <!-- POD NAME - ONLY EDITABLE FIELD -->

            <div class="edit-field">

                <h:outputLabel
                    for="podName"
                    value="Pod Name" />

                <h:inputText
                    id="podName"
                    value="#{podBean.editPodLabel}"
                    styleClass="edit-input"
                    required="true"
                    requiredMessage="Please enter a pod name." />

                <h:message
                    for="podName"
                    styleClass="edit-message" />

            </div>


            <!-- BUTTONS -->

            <div class="edit-buttons">

                <h:commandButton
                    value="Save Changes"
                    action="#{podBean.savePod}"
                    styleClass="edit-button edit-save" />

                <h:commandButton
                    value="Cancel"
                    action="#{podBean.cancel}"
                    immediate="true"
                    styleClass="edit-button edit-cancel" />

            </div>


        </h:form>

    </div>

</h:body>

</html>
