<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">
<f:metadata>
    <!-- Checks the user is an admin before the view is rendered -->
    <f:viewAction action="#{LoginBean.checkAdminAccess}" />
</f:metadata>

<h:head>
	<h:outputStylesheet library="css" name="styles.css" />
	<title>Pet Hotel - Registered Users</title>
</h:head>

<h:body>
<ui:include src="/WEB-INF/includes/header.xhtml" />
	<!--  TODO ONCE BOOKINGS HAVE BEEN MADE 
	table created for the dashboard view  
	This page has been made as a placeholder
	-->
<div class="dashboard-wrapper">
<div class="dashboard-title">Contact Form Messages </div>

	<!-- Display total number of registered users -->

		<p>
			Number of messages: <strong>#{contactForm.numberOfMessages}</strong>
		</p>


		<!-- Table displaying all users stored in the ApplicationScoped list -->

		<h:dataTable value="#{contactForm.contact}" var="contact"
			styleClass="productTable" headerClass="productTableHeader"
			rowClasses="productTableOddRow, productTableEvenRow">
			<h:column>
				<f:facet name="header">Name</f:facet>
            #{booking.name}
        </h:column>

			<h:column>
				<f:facet name="header">Email</f:facet>
            #{contact.email}
        </h:column>
			<h:column>
				<f:facet name="header">Contact Message </f:facet>
            #{contact.message}
        </h:column>
			
       
		</h:dataTable>
		 <br />
		<h:form>
				<h:commandButton value="Return to Dashboard"
					action="#{dashboardBean.dashboard()}" styleClass="btn-green50" />
			</h:form>         class="btn-green50"/>
        </h:form>

</div>
	<br />

</h:body>
</html>
