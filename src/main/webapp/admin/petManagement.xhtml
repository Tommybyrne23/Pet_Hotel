<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <h:outputStylesheet library="css" name="styles.css" />
    <title>Pet Hotel - Registered Pets</title>
</h:head>

<h:body>
    <h1>Registered Pets Directory</h1>
    <!-- Display total number of registered pets -->
    <center>
    <p>
        Total Registered Pets:
        <strong>#{petList.numberOfPets}</strong>
    </p>

    <!-- Table displaying all pets stored in PetList -->
    <h:dataTable value="#{petList.pets}"
                 var="p"
                 styleClass="productTable"
                 headerClass="productTableHeader"
                 rowClasses="productTableOddRow, productTableEvenRow">

        <h:column>
            <f:facet name="header">Pet ID</f:facet>
            #{p.petID}
        </h:column>


        <h:column>
            <f:facet name="header"> Pet's Name</f:facet>
            #{p.name}
        </h:column>


        <h:column>
            <f:facet name="header">Species</f:facet>
            #{p.species}
        </h:column>


        <h:column>
            <f:facet name="header">Breed</f:facet>
            #{p.breed}
        </h:column>


        <h:column>
            <f:facet name="header">Age</f:facet>
            #{p.age}
        </h:column>
		
  	 	<!-- New/Updated column to look up the owner's name -->
        <h:column>
            <f:facet name="header">Owner Name</f:facet>
            #{userList.getUserNameById(p.userID)}
        </h:column>

    </h:dataTable>
    <br />
    <!-- Wrapped in h:form so action navigation works properly -->
			<h:form id="navigationForm">
				<h:commandButton value="Back to Dashboard"
					action="/adminDashboard?faces-redirect=true" class="commandButton" />
			</h:form>
</center>
    <br />

</h:body>
</html>
