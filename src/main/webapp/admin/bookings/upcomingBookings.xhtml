<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core" 
	xmlns:ui="jakarta.faces.facelets" >

<f:metadata>
    <!-- Checks the user is an admin before the view is rendered -->
    <f:viewAction action="#{LoginBean.checkAdminAccess}" />
</f:metadata>

<h:head>
	<h:outputStylesheet library="css" name="styles.css" />
	<title>Pet Hotel - Registered Users</title>
</h:head>

<h:body>

	<h1>Upcoming Bookings</h1>
	<center>
		<p> Get ready to welcome these little rascals!</p>

                <h:dataTable value="#{reservationList.futureReservations}" var="booking"
                             rendered="#{not empty reservationList.futureReservations}"
                             styleClass="productTable" headerClass="productTableHeader"
                             rowClasses="productTableOddRow, productTableEvenRow">
                    <h:column><f:facet name="header">Booking #</f:facet>#{booking.reservationID}</h:column>
                    <h:column><f:facet name="header">Pet</f:facet>#{booking.petName}</h:column>
                    <h:column><f:facet name="header">Check In</f:facet>#{booking.checkInDate}</h:column>
                    <h:column><f:facet name="header">Check Out</f:facet>#{booking.checkOutDate}</h:column>
                    <h:column><f:facet name="header">Price</f:facet>€#{booking.totalPrice}</h:column>
                    <h:column><f:facet name="header">Status</f:facet>#{booking.status}</h:column>
                </h:dataTable>
                <h:outputText value="No upcoming bookings." rendered="#{empty reservationList.futureReservations}" />
                
		
			
		<br />

			<!-- Wrapped in h:form so action navigation works properly --><br />
			<h:form id="navigationForm">
				<h:commandButton value="Back to Dashboard"
					action="/adminDashboard?faces-redirect=true" class="btn-green50" />
			</h:form>
		
	</center>
	<div class="dashboard-grid"></div>
	<br />

</h:body>
</html>
