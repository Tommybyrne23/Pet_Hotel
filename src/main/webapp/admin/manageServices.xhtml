<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">
<f:metadata>
    <!-- Checks the user is an admin before the view is rendered -->
    <f:viewAction action="#{LoginBean.checkAdminAccess}" />
</f:metadata>
<h:head>
    <h:outputStylesheet library="css" name="styles.css" />
    <title>Pet Hotel - ADMIN MANAGE SERVICES</title>
</h:head>

<h:body>
	<!--  Section One add new services  -->
	<h2>Add a service</h2>
	
	<h:form id="adminAddService" styleClass="admin-form-panel">

		<!-- Display current name of service -->
		
		<div class="form-field">
		<h:outputLabel value="Name of service:" />
		<h:inputText id="nameInput" value="#{Services.editName}"
			required="true" requiredMessage="Name is required." />
		</div>

		<!-- Display current Description -->
		<div class="form-field">
		<h:outputLabel value="Description" />
		<h:inputText id="description" value="#{Services.editDescription}"
			required="true"
			requiredMessage="Add a description for the service being offered" />
		</div>

		<!-- Price - need to add pricing  -->
		<div class="form-field">
		<h:outputLabel value="Price" />
		<h:inputText id="price" value="#{Services.editPrice}" required="true"
			requiredMessage="Please add a price for our little boarders." redisplay="true" />
		</div>

		<!--  How is this service charged-->

		<div class="form-field">
		<h:outputLabel value="Service Charge Type:" />

		<h:selectOneRadio id="chargeTypeInput"
			value="#{Services.editChargeType}" required="true"
			requiredMessage="PLease select one." layout="lineDirection">	<!-- change to lineDirection for horizontal layout page direction for vertical -->

			<f:selectItem itemLabel="Per Stay" itemValue="Per Stay" />
			<f:selectItem itemLabel="Per Night" itemValue="Per Night" />
			<f:selectItem itemLabel="Per Week" itemValue="Per Week" />

		</h:selectOneRadio>
		</div>
		<!-- Service Linked to pet type -->
		<div class="form-field">
			<h:outputLabel value="Select Animals:" />
			<h:selectManyCheckbox id="petTypeInput"
				value="#{Services.applicableSpecies}" required="true"
				requiredMessage="Select at least one animal type."
				layout="lineDirection">
				<f:selectItems value="#{Services.speciesOptions}" />
			</h:selectManyCheckbox>
		</div>
		<!-- Save and Cancel buttons -->
			
			<!-- end the 2 column form grid -->
 				
			<h:panelGroup styleClass="button-row">
				<h:commandButton value="Add Service"
								 class="btn-green50"
								 action="#{Services.addNewService}" />
								 
				<h:commandButton value="Reset" 
								 class="btn-green50"
								 immediate="true"
								 action="#{ServicesBean.reset}" />
			</h:panelGroup>
			
			
			<!-- Removing back to dashboard as there is an admin dashobard further down  	
			<h:panelGroup styleClass="login-prompt">
				<h:link outcome="userDashboard" value="Back to Dashboard" />
			</h:panelGroup> -->
			
			
			<!-- Message box for errors and success -->
			<h:panelGroup layout="block" styleClass="message-box">
				<h:messages errorClass="error-messages" infoClass="success-messages" />
			</h:panelGroup>
		
		</h:form>
		
		
	
	<!--  SECTION 2 - view / edit services  -->
	
    <h1>View all products and services</h1>

    <center>
        <!-- Table displaying services -->
        <h:dataTable value="#{ServuiceList.services}" var="services" styleClass="productTable"
                     headerClass="productTableHeader"
                     rowClasses="productTableOddRow, productTableEvenRow">
            <h:column>
                <f:facet name="header">Service Name</f:facet>
                #{services.names}
            </h:column>

            <h:column>
                <f:facet name="header">Description</f:facet>
                #{services.description}
            </h:column>

            <h:column>
                <f:facet name="header">Price</f:facet>
                #{services.price}
            </h:column>

            <h:column>
                <f:facet name="header">Price Type</f:facet>
                #{services.price}
            </h:column>


            <h:column>
                <f:facet name="header">Animal Type</f:facet>
                #{services.imagelink}
            </h:column>
        </h:dataTable>
        
        <!-- Wrapped in h:form so action navigation works properly -->
        <br />
        <h:form id="navigationForm">
            <h:commandButton value="Back to Dashboard"
                             action="/adminDashboard?faces-redirect=true" 
                             class="btn-green50"/>
        </h:form>
    </center>

	<div class="dashboard-grid">
	
	</div>
    <br />
    
</h:body>
</html>
