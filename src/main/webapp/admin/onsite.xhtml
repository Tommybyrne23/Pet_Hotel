<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core" 
	xmlns:ui="jakarta.faces.facelets" >

<f:metadata>
    <!-- Checks the user is an admin before the view is rendered -->
    <f:viewAction action="#{LoginBean.checkAdminAccess}" />
</f:metadata>

<h:head>
	<h:outputStylesheet library="css" name="styles.css" />
	<title>Pet Hotel - Registered Users</title>
</h:head>

<h:body>

	<h1>Who's Aboard</h1>
	<center>
		<p> Pets currently boarding with us </p>
		
		<h:dataTable value="#{reservationList.activeBookings}" var="r"
                             rendered="#{not empty reservationList.activeBookings}"
                             styleClass="productTable" headerClass="productTableHeader"
                             rowClasses="productTableOddRow, productTableEvenRow">
                    <h:column><f:facet name="header">Booking #</f:facet>#{r.reservationID}</h:column>
                    <h:column><f:facet name="header">Customer Name</f:facet>#{userList.getUserNameById(r.userID)}</h:column>
                    <h:column><f:facet name="header">Pet Name</f:facet>#{r.petName}</h:column>
                    <h:column><f:facet name="header">Check In</f:facet>#{r.checkInDate}</h:column>
                    <h:column><f:facet name="header">Check Out</f:facet>#{r.checkOutDate}</h:column>
                    <h:column><f:facet name="header">Price</f:facet>€#{r.totalPrice}</h:column>
                    <h:column><f:facet name="header">Status</f:facet>#{r.status}</h:column>
                    <!-- <h:column><f:facet name="header">Services</f:facet>#{r.services}</h:column> -->
                </h:dataTable>
                <h:outputText value="No pets currently on-site." rendered="#{empty reservationList.activeBookings}" />
		
			
		<br />

			<!-- Wrapped in h:form so action navigation works properly --><br />
			<h:form id="navigationForm">
				<h:commandButton value="Back to Dashboard"
					action="/adminDashboard?faces-redirect=true" class="btn-green50" />
			</h:form>
		
	</center>
	<div class="dashboard-grid"></div>
	<br />

</h:body>
</html>
