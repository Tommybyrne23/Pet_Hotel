<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <h:outputStylesheet library="css" name="styles.css" />
    <title>Pet Hotel - Show Pods and Rooms </title>
</h:head>

<h:body>
	<!-- TODO ONCE BOOKINGS HAVE BEEN MADE 
	table created for the dashboard view  
	This page has been made as a placeholder
	-->
    <h1>View all products and services</h1>

    <center>
        <!-- Table displaying services -->
        <h:dataTable value="#{confirmBookings.bookings}" var="booking" styleClass="productTable"
                     headerClass="productTableHeader"
                     rowClasses="productTableOddRow, productTableEvenRow">
            <h:column>
                <f:facet name="header">Pod Name</f:facet>
                #{pod.name}
            </h:column>

            <h:column>
                <f:facet name="header">Pod Type </f:facet>
                #{pod.type}
            </h:column>

            <h:column>
                <f:facet name="header">Location</f:facet>
                #{pod.location}
            </h:column>

            <h:column>
                <f:facet name="header">Image Link</f:facet>
                #{services.imagelink}
            </h:column>
        </h:dataTable>
        
        <!-- Wrapped in h:form so action navigation works properly -->
        <h:form id="navigationForm">
            <h:commandButton value="Back to Dashboard"
                             action="/adminDashboard?faces-redirect=true" 
                             class="commandButton"/>
        </h:form>
    </center>

	<div class="dashboard-grid">
	
	</div>
    <br />
    
</h:body>
</html>
