<!DOCTYPE html>
<!-- PayPal returns here if the buyer cancels. cancelPayment() releases the held pod. -->
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
    <f:metadata>
        <f:viewAction action="#{BookingBean.cancelPayment}" />
    </f:metadata>
    <h:head>
        <title>Payment Cancelled</title>
    </h:head>
    <h:body>
        <h2>Payment Cancelled</h2>
        <h:messages />
        <h:link value="Back to Dashboard" outcome="/userDashboard" />
    </h:body>
</html>
