<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">
    <h:head><title>Pay</title></h:head>
    <h:body>
        <h:form>
            <h:panelGrid columns="2">
                <h:outputLabel value="Item:" />
                <h:inputText value="#{authorizePayment.product}" />
                <h:outputLabel value="Total (EUR):" />
                <h:inputText value="#{authorizePayment.total}" />
            </h:panelGrid>
            <h:commandButton value="Pay with PayPal" action="#{authorizePayment.checkOut}" />
        </h:form>
    </h:body>
</html>
