<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>

    <h:outputStylesheet
        library="css"
        name="registration.css" />

    <link rel="icon"
          type="image/png"
          href="#{request.contextPath}/images/AdamsArkAndAvery.ico" />

    <title>Edit Pet</title>

</h:head>


<h:body styleClass="reg-page">

    <!-- Load the user's pets when the page opens -->
    <f:metadata>
        <f:event
            type="preRenderView"
            listener="#{PetEditBean.loadPets}" />
    </f:metadata>


    <div class="reg-split">

        <div class="reg-panel"
             style="flex: 1; width: 100%;">

            <h:form
                id="petEditForm"
                styleClass="reg-form"
                style="max-width: 500px; margin: 0 auto;">

                <h1 class="reg-brand">
                    3A Pet Hotel
                </h1>

                <h2 class="reg-welcome">
                    Edit your pet's details.
                </h2>


                <!-- MESSAGES -->

                <h:panelGroup
                    layout="block"
                    styleClass="message-box">

                    <h:messages
                        errorClass="error-messages"
                        infoClass="success-messages" />

                </h:panelGroup>


                <!-- NO PETS MESSAGE -->

                <h:panelGroup
                    rendered="#{empty PetEditBean.userPets}"
                    layout="block">

                    <p style="
                        font-size: 16px;
                        color: #721c24;
                        background-color: #f8d7da;
                        padding: 15px;
                        border-radius: 6px;
                        text-align: center;">

                        You need to register a pet before you can edit
                        pet details.

                    </p>

                    <h:button
                        outcome="/addPet"
                        value="Register a Pet"
                        styleClass="btn-green" />

                    <h:button
                        outcome="/userDashboard"
                        value="Back to Dashboard"
                        styleClass="btn-green-outline" />

                </h:panelGroup>


                <!-- PET EDITING SECTION -->
                <!-- Only shown if the user has at least one pet -->

                <h:panelGroup
                    rendered="#{not empty PetEditBean.userPets}"
                    layout="block">


                    <!-- PET SELECTION -->

                    <div class="form-field">

                        <h:outputLabel
                            for="petSelect"
                            value="Select Pet" />

                        <h:selectOneMenu
                            id="petSelect"
                            value="#{PetEditBean.selectedPetID}"
                            required="true"
                            requiredMessage="Please select a pet.">

                            <f:selectItem
                                itemLabel="-- Select Pet --"
                                itemValue="0"
                                noSelectionOption="true" />

                            <f:selectItems
                                value="#{PetEditBean.userPets}"
                                var="pet"
                                itemLabel="#{pet.name}"
                                itemValue="#{pet.petID}" />

                            <f:ajax
                                execute="@this"
                                listener="#{PetEditBean.petChanged}"
                                render="petDetails" />

                        </h:selectOneMenu>

                        <h:message
                            for="petSelect"
                            errorClass="field-error" />

                    </div>


                    <!-- PET DETAILS -->

                    <h:panelGroup
                        id="petDetails"
                        layout="block">


                        <!-- PET NAME -->

                        <div class="form-field">

                            <h:outputLabel
                                for="petNameInput"
                                value="Pet Name" />

                            <h:inputText
                                id="petNameInput"
                                value="#{PetEditBean.selectedPet.name}"
                                required="true"
                                requiredMessage="Name is required." />

                            <h:message
                                for="petNameInput"
                                errorClass="field-error" />

                        </div>


                        <!-- SPECIES -->

                        <div class="form-field">

                            <h:outputLabel
                                for="speciesInput"
                                value="Species" />

                            <h:selectOneMenu
                                id="speciesInput"
                                value="#{PetEditBean.selectedPet.species}"
                                required="true"
                                requiredMessage="Species is required.">

                                <f:selectItem
                                    itemLabel="-- Select Species --"
                                    itemValue=""
                                    noSelectionOption="true" />

                                <f:selectItem
                                    itemLabel="Dog"
                                    itemValue="DOG" />

                                <f:selectItem
                                    itemLabel="Cat"
                                    itemValue="CAT" />

                                <f:selectItem
                                    itemLabel="Bird"
                                    itemValue="BIRD" />

                                <f:selectItem
                                    itemLabel="Reptile"
                                    itemValue="REPTILE" />

                                <f:selectItem
                                    itemLabel="Fish"
                                    itemValue="FISH" />

                            </h:selectOneMenu>

                            <h:message
                                for="speciesInput"
                                errorClass="field-error" />

                        </div>


                        <!-- BREED -->

                        <div class="form-field">

                            <h:outputLabel
                                for="breedInput"
                                value="Breed" />

                            <h:inputText
                                id="breedInput"
                                value="#{PetEditBean.selectedPet.breed}"
                                required="true"
                                requiredMessage="Breed is required." />

                            <h:message
                                for="breedInput"
                                errorClass="field-error" />

                        </div>


                        <!-- AGE -->

                        <div class="form-field">

                            <h:outputLabel
                                for="ageInput"
                                value="Age" />

                            <h:selectOneMenu
                                id="ageInput"
                                value="#{PetEditBean.selectedPet.age}"
                                required="true"
                                requiredMessage="Age is required.">

                                <f:selectItem
                                    itemLabel="-- Select Age --"
                                    itemValue=""
                                    noSelectionOption="true" />

                                <f:selectItems
                                    value="#{PetEditBean.ageRanges}" />

                            </h:selectOneMenu>

                            <h:message
                                for="ageInput"
                                errorClass="field-error" />

                        </div>


                        <!-- ADDITIONAL REQUIREMENTS -->

                        <div class="form-field">

                            <h:outputLabel
                                for="requirementsInput"
                                value="Additional Requirements" />

                            <h:inputTextarea
                                id="requirementsInput"
                                value="#{PetEditBean.selectedPet.requirements}"
                                rows="5"
                                cols="40"
                                maxlength="200" />

                            <h:message
                                for="requirementsInput"
                                errorClass="field-error" />

                        </div>

                    </h:panelGroup>


                    <!-- BUTTONS -->

                    <h:commandButton
                        value="Save Changes"
                        styleClass="btn-green"
                        action="#{PetEditBean.savePet}" />

                    <h:commandButton
                        value="Cancel"
                        styleClass="btn-green-outline"
                        immediate="true"
                        action="#{PetEditBean.cancel}" />

                    <div class="reg-divider">
                        or
                    </div>

                    <h:button
                        outcome="userDashboard"
                        value="Return to Dashboard"
                        styleClass="btn-green" />

                </h:panelGroup>

            </h:form>

        </div>

    </div>

</h:body>

</html>
