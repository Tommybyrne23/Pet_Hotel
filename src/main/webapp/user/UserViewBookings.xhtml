
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">


<f:metadata>
    <f:viewAction action="#{LoginBean.checkCustomerAccess}" />
</f:metadata>

<h:head>
	<h:outputStylesheet library="css" name="styles.css" />
	<title>My Bookings</title>
</h:head>

<h:body>

<ui:include src="/WEB-INF/includes/header.xhtml" />
<div class="dashboard-wrapper">  <!-- makes the page width slightly narrower, tables look better -->
    <div class="dashboard-title">My Bookings</div>

	<h:form>

		<h:outputText value="Number of bookings: #{BookingBean.userBookings.size()}" />

		<br /><br />

		<!-- If user has no bookings -->
		<h:panelGroup rendered="#{empty BookingBean.userBookings}">
			<h:outputText value="You have no bookings yet." />
			<br />
			<h:link outcome="makeBooking" value="Make a Booking" />
		</h:panelGroup>

		<!-- Bookings table -->
<h:dataTable value="#{BookingBean.userBookings}"
    var="booking"
    rendered="#{not empty BookingBean.userBookings}"
    styleClass="productTable"
    headerClass="productTableHeader"
    rowClasses="productTableOddRow, productTableEvenRow">

			<h:column>
				<f:facet name="header">Booking No.</f:facet>
				#{booking.reservationID}
			</h:column>

			<h:column>
				<f:facet name="header">Pet</f:facet>
				#{booking.petName}
			</h:column>

			<h:column>
				<f:facet name="header">Check-In</f:facet>
				#{booking.checkInDate}
			</h:column>

			<h:column>
				<f:facet name="header">Check-Out</f:facet>
				#{booking.checkOutDate}
			</h:column>

			<h:column>
				<f:facet name="header">Price</f:facet>
				&#8364;#{booking.totalPrice}
			</h:column>

			<h:column>
				<f:facet name="header">Status</f:facet>
				#{booking.status}
			</h:column>

		</h:dataTable>

		<br />
<h:form>
				<h:commandButton value="Return to Dashboard"
					action="#{dashboardBean.dashboard()}" styleClass="btn-green50" />
			</h:form>
	</h:form>
</div>
</h:body>
</html>
