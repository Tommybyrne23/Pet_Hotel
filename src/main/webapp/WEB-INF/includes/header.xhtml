<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets">

	<!-- Shared, role-aware navigation bar using custom CSS -->
	<nav class="app-navbar">
		<div class="navbar-container">

			<!-- Brand logo and hotel name -->
			<h:link styleClass="navbar-brand" outcome="/index">
				<img src="#{request.contextPath}/images/logo.png" alt="3A Pet Hotel"
				     onerror="this.style.display='none'" />
				<span>Adam's Ark &amp; Avery</span>
			</h:link>

			<!-- Navigation Links -->
			<ul class="navbar-menu">
				<li class="nav-item"><h:link
						styleClass="nav-link #{view.viewId eq '/index.xhtml' ? 'nav-link-active' : ''}"
						outcome="/index" value="Home" /></li>

				<!-- Signed-in customers -->
				<ui:fragment
					rendered="#{LoginBean.loggedIn and not LoginBean.admin and not LoginBean.attendant}">
					<li class="nav-item"><h:link
							styleClass="nav-link #{view.viewId eq '/userDashboard.xhtml' ? 'nav-link-active' : ''}"
							outcome="/userDashboard" value="Dashboard" /></li>
					<li class="nav-item"><h:link
							styleClass="nav-link #{view.viewId eq '/user/manageProfile.xhtml' ? 'nav-link-active' : ''}"
							outcome="/user/manageProfile" value="Manage Profile" /></li>
					<li class="nav-item"><h:link
							styleClass="nav-link #{view.viewId eq '/user/makeBooking.xhtml' ? 'nav-link-active' : ''}"
							outcome="/user/makeBooking" value="New Booking" /></li>
					<li class="nav-item"><h:link
							styleClass="nav-link #{view.viewId eq '/user/UserViewBookings.xhtml' ? 'nav-link-active' : ''}"
							outcome="/user/UserViewBookings" value="My Bookings" /></li>
					<li class="nav-item"><h:link
							styleClass="nav-link #{view.viewId eq '/contactUs.xhtml' ? 'nav-link-active' : ''}"
							outcome="/contactUs" value="Contact Us" /></li>
				</ui:fragment>

				<!-- Administrators -->
				<ui:fragment rendered="#{LoginBean.admin}">
					<li class="nav-item"><h:link
							styleClass="nav-link #{view.viewId eq '/adminDashboard.xhtml' ? 'nav-link-active' : ''}"
							outcome="/adminDashboard" value="Dashboard" /></li>
					<li class="nav-item"><h:link
							styleClass="nav-link #{view.viewId eq '/admin/userList.xhtml' ? 'nav-link-active' : ''}"
							outcome="/admin/userList" value="Users" /></li>
					<li class="nav-item"><h:link
							styleClass="nav-link #{view.viewId eq '/admin/petManagement.xhtml' ? 'nav-link-active' : ''}"
							outcome="/admin/petManagement" value="Pets" /></li>
					<li class="nav-item"><h:link
							styleClass="nav-link #{view.viewId eq '/admin/bookings/onsite.xhtml' ? 'nav-link-active' : ''}"
							outcome="/admin/bookings/onsite" value="On Site" /></li>
					<li class="nav-item"><h:link
							styleClass="nav-link #{view.viewId eq '/admin/viewPodsRooms.xhtml' ? 'nav-link-active' : ''}"
							outcome="/admin/viewPodsRooms" value="Pods &amp; Rooms" /></li>
					<li class="nav-item"><h:link
							styleClass="nav-link #{view.viewId eq '/admin/manageServices.xhtml' ? 'nav-link-active' : ''}"
							outcome="/admin/manageServices" value="Prices &amp; Services" /></li>
				</ui:fragment>

				<!-- Attendants -->
				<ui:fragment
					rendered="#{LoginBean.attendant and not LoginBean.admin}">
					<li class="nav-item"><h:link
							styleClass="nav-link #{view.viewId eq '/attendantDashboard.xhtml' ? 'nav-link-active' : ''}"
							outcome="/attendantDashboard" value="Dashboard" /></li>
					<li class="nav-item"><h:link
							styleClass="nav-link #{view.viewId eq '/admin/petManagement.xhtml' ? 'nav-link-active' : ''}"
							outcome="/admin/petManagement" value="Pets" /></li>
					<li class="nav-item"><h:link
							styleClass="nav-link #{view.viewId eq '/admin/bookings/allBookings.xhtml' ? 'nav-link-active' : ''}"
							outcome="/admin/bookings/onsite" value="On Site" /></li>
				</ui:fragment>
			</ul>

			<!-- Right Section: Authentication status -->
			<div class="navbar-user-section">
				<!-- Signed-out visitors -->
				<ui:fragment rendered="#{not LoginBean.loggedIn}">
					<ul class="navbar-menu">
						<li class="nav-item"><h:link
								styleClass="nav-link #{view.viewId eq '/contactUs.xhtml' ? 'nav-link-active' : ''}"
								outcome="/contactUs" value="Contact Us" /></li>
						<li class="nav-item"><h:link
								styleClass="nav-link btn-nav-register #{view.viewId eq '/login.xhtml' ? 'nav-link-active' : ''}"
								outcome="/login" value="Login" /></li>
						<li class="nav-item"><h:link
								styleClass="nav-link btn-nav-register" outcome="/registration"
								value="Register" /></li>
					</ul>
				</ui:fragment>

				<!-- Signed-in user greeting + logout -->
				<ui:fragment rendered="#{LoginBean.loggedIn}">
					<h:form styleClass="navbar-logout-form">
						<span class="navbar-text">Signed in as <strong>#{LoginBean.loggedInUser.name}</strong></span>
						<h:commandLink styleClass="nav-link logout-link" action="#{LoginBean.logout}" value="Logout" />
					</h:form>
				</ui:fragment>
			</div>

		</div>
	</nav>

</ui:composition>
