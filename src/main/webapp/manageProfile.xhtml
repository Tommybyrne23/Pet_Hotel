<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core">

<h:head>
	<h:outputStylesheet library="css" name="styles.css" />
	<title>My Profile</title>
</h:head>

<h:body>

	<!-- Load user details when the page opens -->
	<f:metadata>
		<f:event type="preRenderView" listener="#{ProfileBean.loadProfile}" />
	</f:metadata>

	<h1>My Profile</h1>

	<h:form id="profileForm" styleClass="account">
		<h:panelGrid columns="1" styleClass="account">

			<!--  Success message shown here after saving -->
			<!-- Error messages shown here when validation fails -->


			<!-- Display current name -->
			<h:outputLabel value="Name:" />
			<h:inputText id="nameInput" value="#{ProfileBean.editName}"
				required="true" requiredMessage="Name is required." />


			<!-- Display current email -->
			<h:outputLabel value="Email:" />
			<h:inputText id="emailInput" value="#{ProfileBean.editEmail}"
				required="true" requiredMessage="Email is required." />


			<!-- Password field with validation -->
			<h:outputLabel value="Password:" />
			<h:inputSecret id="passwordInput" value="#{ProfileBean.editPassword}"
				required="true" requiredMessage="Password is required."
				redisplay="true" />

	
			<!-- Save and Cancel buttons -->
			<h:panelGroup styleClass="button-row">
				<h:commandButton value="Save Changes"
					action="#{ProfileBean.saveProfile}" />
				<h:commandButton value="Cancel" immediate="true"
					action="#{ProfileBean.cancel}" />
			</h:panelGroup>

			<h:panelGroup styleClass="login-prompt">
				<h:link outcome="userDashboard" value="Back to Dashboard" />
			</h:panelGroup>
			<!-- Message box for errors and success -->
			<h:panelGroup layout="block" styleClass="message-box">
				<h:messages errorClass="error-messages" infoClass="success-messages" />
			</h:panelGroup>
		</h:panelGrid>



	</h:form>

</h:body>
</html>
