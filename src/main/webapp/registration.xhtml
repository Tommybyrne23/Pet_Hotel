<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core">

<h:head>
	<h:outputStylesheet library="css" name="registration.css" />
	<link rel="icon" type="image/png" href="#{request.contextPath}/images/AdamsArkAndAvery.ico"/>
	<title>Account Registration</title>
</h:head>

<h:body styleClass="reg-page">

	<div class="reg-split">

		<!-- ===== LEFT THIRD: form ===== -->
		<div class="reg-panel">

			<h:form id="registrationForm" styleClass="reg-form">

				<h1 class="reg-brand">3A Pet Hotel</h1>
				<h2 class="reg-welcome">Create your account to book your pet's stay.</h2>

				<h:panelGroup layout="block" styleClass="message-box">
					<h:messages globalOnly="true" errorClass="error-messages"
						infoClass="success-messages" />
				</h:panelGroup>

				<div class="form-field">
					<h:outputLabel for="nameInput" value="Name" />
					<h:inputText id="nameInput" value="#{RegistrationBean.user.name}"
						required="true" requiredMessage="Name is required." />
					<h:message for="nameInput" errorClass="field-error" />
				</div>

				<div class="form-field">
					<h:outputLabel for="emailInput" value="Email" />
					<h:inputText id="emailInput" value="#{RegistrationBean.user.email}"
						required="true" requiredMessage="Email is required."
						validatorMessage="Enter a valid email address, for example name@example.com">
						<f:validateRegex pattern="^[^@\s]+@[^@\s]+\.[A-Za-z]{2,}$" />
					</h:inputText>
					<h:message for="emailInput" errorClass="field-error" />
				</div>

				<div class="form-field">
					<h:outputLabel for="passwordInput" value="Password" />
					<h:inputSecret id="passwordInput"
						value="#{RegistrationBean.user.password}" required="true"
						requiredMessage="Password is required."
						validatorMessage="Password must be at least 8 characters and include an uppercase letter, a lowercase letter, a number and a special character.">
						<f:validateRegex
							pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}$" />
					</h:inputSecret>
					<h:message for="passwordInput" errorClass="field-error" />

					<ul class="pw-rules">
						<li>At least 8 characters</li>
						<li>One uppercase and one lowercase letter</li>
						<li>One number</li>
						<li>One special character, e.g. ! ? # €</li>
					</ul>
				</div>

				<div class="form-field">
					<h:outputLabel for="confirmPasswordInput" value="Confirm Password" />
					<h:inputSecret id="confirmPasswordInput" value="#{RegistrationBean.confirmPassword}"
						required="true" requiredMessage="Please confirm your password." />
					<h:message for="confirmPasswordInput" errorClass="field-error" />
				</div>

				<h:commandButton value="Register" styleClass="btn-green"
					action="#{RegistrationBean.register}" />

				<h:commandButton value="Reset" styleClass="btn-green-outline"
					immediate="true" action="#{RegistrationBean.reset}" />

				<div class="reg-divider">or</div>

				<h:button outcome="login" value="Log In Here" styleClass="btn-green" />

				<h:button outcome="index" value="Return to Homepage" styleClass="btn-green" />

			</h:form>

		</div>

		<!-- ===== RIGHT TWO THIRDS: hero image ===== -->
		<div class="reg-hero">
			<h:graphicImage value="/images/cat.jpg" alt="A cat relaxing in a 3A pod"
				styleClass="reg-hero-img" />
			<span class="reg-hero-text">Join the family.</span>
		</div>

	</div>

</h:body>
</html>
