<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core">

<h:head>
	<h:outputStylesheet library="css" name="styles.css" />
	<title>Account Registration</title>
</h:head>
<h:body>
	<h1>Register an account</h1>
	<h:form>
		<h:panelGrid columns="1" styleClass="register-grid">
			<h:outputLabel value="Name:" />
			<h:inputText id="nameInput" value="#{registrationBean.name}">
				<f:validateLength minimum="1" />
			</h:inputText>
			

			<h:outputLabel value="Email:" />
			<h:inputText id="emailInput" value="#{registrationBean.email}">
				<f:validateLength minimum="1" />
			</h:inputText>

			<h:outputLabel value="Password:" />
			<h:inputSecret id="passwordInput"
				value="#{registrationBean.password}">
				<f:validateLength minimum="1" />
				<!--  message to pop-up for empty password message -->
			</h:inputSecret>

			<br />
			<h:commandButton value="Register"
				action="#{registrationBean.register}" />
			<h:commandButton type="reset" value="Reset" />
		</h:panelGrid>
	</h:form>
</h:body>
</html>
