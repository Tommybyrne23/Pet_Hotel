<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core">

<h:head>
	<h:outputStylesheet library="css" name="styles.css" />
	<title>Account Registration</title>
</h:head>
<h:body>
	<h1>Register an account</h1>
	<h:form id="registrationForm" styleClass="account">
		<h:panelGrid columns="1" styleClass="account">
			<h:outputLabel value="Name:" />
			<!-- added the .user.name to add the User object to the registration bean and will align witht user.bean -->
			<h:inputText id="nameInput" value="#{RegistrationBean.user.name}"
				required="true" requiredMessage="Name is required." />


			<h:outputLabel value="Email:" />
			<h:inputText id="emailInput" value="#{RegistrationBean.user.email}"
				required="true" requiredMessage="Email is required." />

			<h:outputLabel value="Password:" />
			<h:inputSecret id="passwordInput"
				value="#{RegistrationBean.user.password}" required="true"
				requiredMessage="Password is required." />

			<h:outputLabel value="Confirm Password:" />
			<h:inputSecret id="confirmPasswordInput"
				value="#{RegistrationBean.confirmPassword}" required="true"
				requiredMessage="Please confirm your password." />

			<h:panelGroup styleClass="button-row">
				<h:commandButton value="Register"
					action="#{RegistrationBean.register}" />
				<h:commandButton value="Reset" immediate="true"
					action="#{RegistrationBean.reset}" />
			</h:panelGroup>

			<h:panelGroup styleClass="login-prompt">
    			Already have an account?
    			<h:link outcome="login" value="Log in here." />
				<br />
				<h:link outcome="index" value="Return Home." />
			</h:panelGroup>
		</h:panelGrid>
		<h:messages />
	</h:form>
</h:body>
</html>
