<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">

<h:head>
	<h:outputStylesheet library="css" name="styles.css" />
	<title>My Bookings</title>
</h:head>

<h:body>
	<ui:include src="/WEB-INF/includes/header.xhtml" />
	<div class="dashboard-wrapper">
	
	<h1>My Bookings</h1>

	<h:form styleClass="account">

		<!-- If user has no bookings -->
		<h:panelGroup
			rendered="#{empty BookingBean.userBookings}">
			<p style="text-align: center; font-size: 16px;
				color: #666;">
				You have no bookings yet.
			</p>
			<h:link outcome="makeBooking"
				value="Make a Booking"
				style="font-size: 16px; font-weight: bold;" />
		</h:panelGroup>

		<!-- If user has bookings, show them in a table -->
		<h:dataTable value="#{BookingBean.userBookings}"
			var="booking"
			rendered="#{not empty BookingBean.userBookings}"
			styleClass="booking-table"
			headerClass="booking-header">

			<h:column>
				<f:facet name="header">Pet</f:facet>
				#{booking.petName}
			</h:column>

			<h:column>
				<f:facet name="header">Check-In</f:facet>
				#{booking.checkInDate}
			</h:column>

			<h:column>
				<f:facet name="header">Check-Out</f:facet>
				#{booking.checkOutDate}
			</h:column>

			<h:column>
				<f:facet name="header">Price</f:facet>
				\u20AC#{booking.totalPrice}
			</h:column>

			<h:column>
				<f:facet name="header">Status</f:facet>
				#{booking.status}
			</h:column>

		</h:dataTable>

		<br />

		<h:link outcome="userDashboard"
			value="Back to Dashboard" />

	</h:form>
</div>
	<ui:include src="/WEB-INF/includes/footer.xhtml" />
</h:body>
</html>
