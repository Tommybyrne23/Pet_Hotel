<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core">

<f:view transient="true">

	<h:head>
		<h:outputStylesheet library="css" name="styles.css" />
		<title>Login</title>
	</h:head>

	<h:body>

		<h1>Login To Account</h1>

		<h:form id="loginForm">

			<h:panelGrid columns="1" styleClass="account">

				<h:outputLabel value="Email:" />
				<h:inputText id="emailInput" value="#{LoginBean.email}">
					<f:validateLength minimum="1" />
				</h:inputText>


				<h:outputLabel value="Password:" />
				<h:inputSecret id="passwordInput" value="#{LoginBean.password}">
					<f:validateLength minimum="1" />
				</h:inputSecret>


				<br />

				<h:commandButton value="Login" action="#{LoginBean.login}" />

				<h:commandButton type="reset" value="Reset" />

				<h:panelGroup styleClass="login-prompt">
				    Need to register?
	    			<h:link outcome="registration" value="Register here." />
					<br />
					<h:link outcome="index" value="Return Home." />
				</h:panelGroup>

				<h:panelGroup layout="block" styleClass="message-box">
					<h:messages errorClass="error-messages"
						infoClass="success-messages" />
				</h:panelGroup>
			</h:panelGrid>



		</h:form>
<!--  Login error message from faces -->
<h:panelGroup rendered="#{not empty facesContext.messageList}">
    <script type="text/javascript">
        window.addEventListener("DOMContentLoaded", function() {
            alert("#{facesContext.messageList[0].summary}");
        });
    </script>
</h:panelGroup>

	</h:body>
</f:view>
</html>
